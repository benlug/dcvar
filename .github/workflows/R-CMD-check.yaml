on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # Linux hosted runners repeatedly terminate during the full Stan-backed
    # test suite. Keep the push matrix CRAN-like, but skip backend sampling on
    # Ubuntu and run those tests in the opt-in Backend Stan tests workflow.
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      DCVAR_SKIP_STAN_TESTS: ${{ matrix.config.os == 'ubuntu-latest' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Keep the shared matrix on hard dependencies plus explicit test/vignette
      # packages. Optional CmdStan tooling lives in backend-stan-tests.yaml.
      #
      # Pin the source-compiled Stan/Eigen stack to CRAN. DESCRIPTION lists the
      # Stan r-universe in Additional_repositories (for cmdstanr), which also
      # offers development rstan/StanHeaders builds with a higher version than
      # CRAN. pak would otherwise prefer those dev builds, but they require a
      # newer RcppEigen than CRAN ships, so the Linux source build of rstan fails
      # (e.g. "'plain_enum_min' is not a member of 'Eigen::internal'"). Forcing
      # the consistent CRAN trio avoids the mismatch.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'NA'
          extra-packages: |
            any::BH
            cran::RcppEigen
            cran::StanHeaders
            cran::rstan
            any::testthat
            any::knitr
            any::rmarkdown
            any::tibble
            any::sn
            any::rcmdcheck

      - name: Install qpdf (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf

      - name: Install qpdf (macOS)
        if: runner.os == 'macOS'
        run: brew install qpdf

      - name: Install qpdf (Windows)
        if: runner.os == 'Windows'
        run: choco install qpdf --no-progress

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        with:
          # Keep check artifacts for one diagnostic rerun so platform-specific
          # warnings/errors can be inspected from the uploaded 00check.log.
          upload-results: true
          upload-snapshots: true
          build_args: 'c("--no-manual")'
